<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">OpenVINO C# API</title>
  <desc id="desc">Native OpenVINO inference for .NET, presented as a friendly bridge from a model to a result.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#72d0f8"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="22" fill="#0f1820"/>
  <path d="M0 269C168 247 295 287 460 268S747 238 932 267s199 13 268 1v32H0Z" fill="#122b2c"/>
  <path d="M50 69h44" stroke="#ff8078" stroke-width="5" stroke-linecap="round"/>
  <text x="50" y="54" fill="#72d0f8" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="800" letter-spacing="1.7">// NATIVE OPENVINO INFERENCE FOR .NET</text>

  <text x="48" y="137" fill="#edf7fa" font-family="Inter,Segoe UI,sans-serif" font-size="60" font-weight="850" letter-spacing="0">OpenVINO</text>
  <text x="48" y="198" fill="#ff8078" font-family="Inter,Segoe UI,sans-serif" font-size="62" font-weight="850" letter-spacing="0">C# API</text>
  <text x="51" y="227" fill="#9bb2bf" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="550">Bring native OpenVINO inference into C# applications.</text>

  <g filter="url(#softShadow)">
    <rect x="50" y="245" width="493" height="40" rx="10" fill="#162832" stroke="#34505f"/>
    <text x="68" y="271" fill="#ff8078" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" font-weight="800">›</text>
    <text x="91" y="271" fill="#dcecf2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="15" font-weight="650">dotnet add package JYPPX.OpenVINO.CSharp.API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="633" y="30" width="517" height="240" rx="24" fill="#17374b" stroke="#315268"/>
    <path d="M633 54a24 24 0 0 1 24-24h469a24 24 0 0 1 24 24v28H633Z" fill="#204b68"/>
    <circle cx="662" cy="56" r="5" fill="#ff8078"/>
    <circle cx="681" cy="56" r="5" fill="#ffd166"/>
    <circle cx="700" cy="56" r="5" fill="#52d3ad"/>
    <text x="724" y="61" fill="#edf7fa" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" font-weight="750">OpenVINO runtime</text>

    <g transform="translate(680 113)">
      <path d="M0 4a4 4 0 0 1 4-4h49l16 16v72a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4Z" fill="#3c341d" stroke="#cfaa45" stroke-width="2"/>
      <path d="M53 0v16h16" fill="none" stroke="#cfaa45" stroke-width="2"/>
      <path d="M17 35h35M17 47h28M17 59h35" stroke="#e5c25e" stroke-width="3" stroke-linecap="round"/>
      <text x="34.5" y="79" text-anchor="middle" fill="#f2d77f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="800">MODEL</text>
    </g>

    <path d="M762 159h49" fill="none" stroke="#72d0f8" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 7" marker-end="url(#arrow)"/>

    <g transform="translate(827 94)">
      <path d="M0 67h-19M162 67h19" stroke="#72d0f8" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-20" cy="67" r="8" fill="#ffd166"/>
      <circle cx="182" cy="67" r="8" fill="#ffd166"/>
      <rect width="162" height="137" rx="31" fill="#55b7e9"/>
      <rect x="9" y="18" width="144" height="108" rx="25" fill="#dff5fb"/>
      <rect x="56" y="-12" width="50" height="26" rx="13" fill="#ff8078"/>
      <text x="81" y="7" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="850">C#</text>
      <circle cx="55" cy="68" r="9" fill="#17374b"/>
      <circle cx="107" cy="68" r="9" fill="#17374b"/>
      <circle cx="58" cy="65" r="2.5" fill="#ffffff"/>
      <circle cx="110" cy="65" r="2.5" fill="#ffffff"/>
      <path d="M56 94c14 15 36 15 50 0" fill="none" stroke="#17374b" stroke-width="5" stroke-linecap="round"/>
    </g>

    <path d="M1009 161h35" fill="none" stroke="#72d0f8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <g transform="translate(1052 122)">
      <rect width="70" height="78" rx="18" fill="#153a31" stroke="#3a977d" stroke-width="2"/>
      <path d="M20 42l10 10 22-26" fill="none" stroke="#52d3ad" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 10l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#ffd166"/>
    </g>

    <text x="680" y="247" fill="#9eb7c4" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650" letter-spacing=".5">MODEL</text>
    <text x="849" y="247" fill="#edf7fa" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="750" letter-spacing=".5">C# BRIDGE</text>
    <text x="1056" y="247" fill="#9eb7c4" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650" letter-spacing=".5">RESULT</text>
  </g>
</svg>
