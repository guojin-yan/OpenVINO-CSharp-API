name: Documentation

on:
  workflow_run:
    workflows: [ "Publish OpenVINO CSharp API NuGet" ]
    branches: [ csharp3.3 ]
    types: [ completed ]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Setup DocFX
      run: dotnet tool install -g docfx

    - name: Sync root documents
      run: |
        cp README.md docs/index.md
        cp README.md docs/README.md
        cp README_EN.md docs/README_EN.md
        cp LICENSE.txt docs/LICENSE

    - name: Verify docs structure
      run: |
        echo "docs directory:"
        ls -la docs/
        echo ""
        echo "docs/articles directory:"
        ls -la docs/articles/

    - name: Restore API packages
      run: dotnet restore src/OpenVINO.CSharp.API/OpenVINO.CSharp.API.csproj

    - name: Build API project
      run: dotnet build src/OpenVINO.CSharp.API/OpenVINO.CSharp.API.csproj -c Release --framework net8.0 --no-restore

    - name: Generate API metadata
      run: |
        cd docs
        docfx metadata docfx.json

    - name: Build documentation
      run: |
        cd docs
        docfx build docfx.json

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

  deploy:
    name: Deploy documentation
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
