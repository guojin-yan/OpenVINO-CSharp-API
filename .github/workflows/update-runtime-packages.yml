name: Update OpenVINO Runtime Packages

# Builds the OpenVINO.runtime.<platform> and
# JYPPX.OpenVINO.GenAI.runtime.<platform> NuGet packages from Intel's
# official binary CDN (storage.openvinotoolkit.org) and publishes them
# together.
#
# Publishing target:
#   - If the repo has a NUGET_API_KEY secret -> pushes to NuGet.org
#     (the upstream maintainer's path; one-time secret configuration).
#   - Otherwise -> pushes to GitHub Packages on the current repo owner's
#     namespace, authenticated by the built-in GITHUB_TOKEN
#     (the fork-testing path; no setup required).
#
# Source-of-truth checks:
#   1. Binary archives come from storage.openvinotoolkit.org/repositories/openvino/packages/
#   2. The selected release must also have a non-prerelease tag at
#      github.com/openvinotoolkit/openvino (treats the upstream git tag as
#      the authoritative "this is a real release" signal).
#   3. Each archive is downloaded together with its .sha256 sibling and
#      verified before packing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenVINO release version (e.g. 2026.1.0). Leave blank to auto-detect latest."
        required: false
        type: string
      dry_run:
        description: "Build packages but skip publish step."
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Re-run even if the openvino-runtime-v<version> tag already exists in this repo."
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly: Mondays 06:00 UTC. The discover job no-ops when nothing new
    # has been published (skip-duplicate covers re-publishes too).
    - cron: "0 6 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: update-runtime-packages
  cancel-in-progress: false

jobs:
  discover:
    name: Discover latest OpenVINO release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.runtime.outputs.version }}
      runtime_matrix: ${{ steps.runtime.outputs.matrix }}
      runtime_skip: ${{ steps.runtime.outputs.skip }}
      runtime_reason: ${{ steps.runtime.outputs.reason }}
      genai_version: ${{ steps.genai.outputs.version || '' }}
      genai_matrix: ${{ steps.genai.outputs.matrix || '{"include":[]}' }}
      genai_skip: ${{ steps.genai.outputs.skip || 'true' }}
      genai_reason: ${{ steps.genai.outputs.reason || '' }}
      skip: ${{ steps.runtime.outputs.skip }}
      reason: ${{ steps.runtime.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Test release automation helpers
        run: python3 .github/scripts/test_discovery_and_email.py
      - id: runtime
        name: Resolve target OpenVINO runtime version and matrix
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/discover.py
      - id: genai
        name: Resolve matching OpenVINO GenAI runtime matrix
        if: steps.runtime.outputs.skip != 'true'
        env:
          REQUESTED_VERSION: ${{ steps.runtime.outputs.version }}
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
          LOCAL_TAG_PREFIX: openvino-runtime-v
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/discover_genai.py
      - name: Verify matching runtime releases
        if: steps.runtime.outputs.skip != 'true'
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
          GENAI_VERSION: ${{ steps.genai.outputs.version }}
          GENAI_SKIP: ${{ steps.genai.outputs.skip }}
          GENAI_REASON: ${{ steps.genai.outputs.reason }}
        run: |
          if [ "$GENAI_SKIP" = "true" ]; then
            echo "GenAI runtime discovery skipped: $GENAI_REASON" >&2
            exit 1
          fi
          if [ "$GENAI_VERSION" != "$RUNTIME_VERSION" ]; then
            echo "OpenVINO runtime version ($RUNTIME_VERSION) and GenAI runtime version ($GENAI_VERSION) do not match." >&2
            exit 1
          fi

  build-runtime:
    name: Build Runtime ${{ matrix.id }}
    needs: discover
    if: needs.discover.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.runtime_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build OpenVINO runtime NuGet package
        env:
          PKG_ID: ${{ matrix.id }}
          PKG_VERSION: ${{ needs.discover.outputs.version }}
          ARCHIVE_URL: ${{ matrix.archive_url }}
          SHA256_URL: ${{ matrix.sha256_url }}
          RID: ${{ matrix.rid }}
          KIND: ${{ matrix.kind }}
          OUT_DIR: ${{ github.workspace }}/out
          REPO_ROOT: ${{ github.workspace }}
        run: python3 .github/scripts/build_runtime_nupkg.py
      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-runtime-${{ matrix.id }}
          path: out/*.nupkg
          if-no-files-found: error
          retention-days: 30

  build-genai:
    name: Build GenAI Runtime ${{ matrix.id }}
    needs: discover
    if: needs.discover.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.genai_matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build OpenVINO GenAI runtime NuGet package
        env:
          PKG_ID: ${{ matrix.id }}
          PKG_VERSION: ${{ needs.discover.outputs.genai_version }}
          ARCHIVE_URL: ${{ matrix.archive_url }}
          SHA256_URL: ${{ matrix.sha256_url }}
          RID: ${{ matrix.rid }}
          KIND: ${{ matrix.kind }}
          OUT_DIR: ${{ github.workspace }}/out
          REPO_ROOT: ${{ github.workspace }}
        run: python3 .github/scripts/build_genai_runtime_nupkg.py
      - name: Upload GenAI nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg-genai-${{ matrix.id }}
          path: out/*.nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to NuGet feed
    needs: [discover, build-runtime, build-genai]
    if: ${{ needs.discover.outputs.skip != 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Download all nupkg artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nupkg-*
          merge-multiple: true
      - name: Publish
        env:
          NUPKG_DIR: ${{ github.workspace }}/artifacts
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/publish.sh

  release:
    name: Attach to GitHub Release
    needs: [discover, build-runtime, build-genai, publish]
    if: ${{ needs.discover.outputs.skip != 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: nupkg-*
          merge-multiple: true
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openvino-runtime-v${{ needs.discover.outputs.version }}
          name: OpenVINO Runtime ${{ needs.discover.outputs.version }}
          body: |
            Native OpenVINO runtime and OpenVINO GenAI runtime NuGet packages built from
            [openvino_toolkit ${{ needs.discover.outputs.version }}](https://github.com/openvinotoolkit/openvino/releases/tag/${{ needs.discover.outputs.version }})
            and the matching OpenVINO GenAI release on Intel's official CDN
            at storage.openvinotoolkit.org.

            Each archive's SHA-256 was verified against its `.sha256` sidecar
            before packaging.
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
          make_latest: false

  notify:
    name: Email runtime publication report
    needs: [discover, build-runtime, build-genai, publish, release]
    if: ${{ always() && needs.discover.result == 'success' && needs.discover.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Send release report
        env:
          SMTP_HOST: ${{ secrets.OPENVINO_RELEASE_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.OPENVINO_RELEASE_SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.OPENVINO_RELEASE_SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.OPENVINO_RELEASE_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.OPENVINO_RELEASE_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.OPENVINO_RELEASE_EMAIL_FROM }}
          SMTP_TO: ${{ secrets.OPENVINO_RELEASE_EMAIL_TO }}
          RUNTIME_VERSION: ${{ needs.discover.outputs.version }}
          RUNTIME_MATRIX: ${{ needs.discover.outputs.runtime_matrix }}
          GENAI_MATRIX: ${{ needs.discover.outputs.genai_matrix }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          BUILD_RUNTIME_RESULT: ${{ needs.build-runtime.result }}
          BUILD_GENAI_RESULT: ${{ needs.build-genai.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/openvino-runtime-v${{ needs.discover.outputs.version }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/send_release_email.py
