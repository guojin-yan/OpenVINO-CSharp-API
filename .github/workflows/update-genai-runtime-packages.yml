name: Update OpenVINO GenAI Runtime Packages

# Builds JYPPX.OpenVINO.GenAI.runtime.<platform> packages from Intel's
# official OpenVINO GenAI archive repository. This workflow mirrors the core
# OpenVINO runtime workflow but uses the openvino_genai package source.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenVINO GenAI release version (e.g. 2026.1.0 or 2026.1.0.0). Leave blank to auto-detect latest."
        required: false
        type: string
      dry_run:
        description: "Build packages but skip publish step."
        required: false
        type: boolean
        default: false
      force_republish:
        description: "Re-run even if the openvino-genai-runtime-v<version> tag already exists in this repo."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: update-genai-runtime-packages
  cancel-in-progress: false

jobs:
  discover:
    name: Discover latest OpenVINO GenAI release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.find.outputs.version }}
      matrix: ${{ steps.find.outputs.matrix }}
      skip: ${{ steps.find.outputs.skip }}
      reason: ${{ steps.find.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - id: find
        name: Resolve target GenAI version and platform matrix
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/discover_genai.py

  build:
    name: Build GenAI ${{ matrix.id }}
    needs: discover
    if: needs.discover.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build GenAI NuGet package
        env:
          PKG_ID: ${{ matrix.id }}
          PKG_VERSION: ${{ needs.discover.outputs.version }}
          ARCHIVE_URL: ${{ matrix.archive_url }}
          SHA256_URL: ${{ matrix.sha256_url }}
          RID: ${{ matrix.rid }}
          KIND: ${{ matrix.kind }}
          OUT_DIR: ${{ github.workspace }}/out
          REPO_ROOT: ${{ github.workspace }}
        run: python3 .github/scripts/build_genai_runtime_nupkg.py
      - name: Upload GenAI nupkg artifact
        uses: actions/upload-artifact@v7
        with:
          name: genai-nupkg-${{ matrix.id }}
          path: out/*.nupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GenAI runtime package
    needs: [discover, build]
    if: ${{ needs.discover.outputs.skip != 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Download GenAI nupkg artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: genai-nupkg-*
          merge-multiple: true
      - name: Publish
        env:
          NUPKG_DIR: ${{ github.workspace }}/artifacts
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/publish.sh

  release:
    name: Attach GenAI package to GitHub Release
    needs: [discover, build, publish]
    if: ${{ needs.discover.outputs.skip != 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: genai-nupkg-*
          merge-multiple: true
      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openvino-genai-runtime-v${{ needs.discover.outputs.version }}
          name: OpenVINO GenAI Runtime ${{ needs.discover.outputs.version }}
          body: |
            Native OpenVINO GenAI runtime NuGet packages built from
            Intel's official OpenVINO GenAI archive repository at
            storage.openvinotoolkit.org.

            Each archive's SHA-256 was verified against its `.sha256` sidecar
            before packaging.
          files: artifacts/*.nupkg
          fail_on_unmatched_files: true
          make_latest: false
